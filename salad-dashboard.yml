# Requires Salad Chopping v0.2.2 or later.
# Replace the two statistic IDs with yours from Developer tools > Statistics.
# Paste into a new dashboard's Raw configuration editor, or copy the view
# entry into the views list of an existing dashboard.
title: Salad Performance
views:
  - title: Salad Performance
    path: salad-performance
    icon: mdi:chart-areaspline
    type: sections
    max_columns: 3
    header:
      layout: center
      card:
        type: markdown
        content: "# Salad Performance"
        text_only: true
    sections:
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-areaspline
            heading: Earnings · 24 hours
          - type: statistics-graph
            chart_type: line
            days_to_show: 1
            period: hour
            stat_types:
              - mean
            entities:
              - entity: salad_chopping:earnings_hourly_replace_with_entry_id
                name: Chopped
                color: "#f44336"
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-areaspline
            heading: Earnings · 7 days
          - type: statistics-graph
            chart_type: line
            days_to_show: 7
            period: day
            stat_types:
              - mean
            entities:
              - entity: salad_chopping:earnings_daily_replace_with_entry_id
                name: Chopped
                color: "#f44336"
      - type: grid
        cards:
          - type: heading
            icon: mdi:chart-areaspline
            heading: Earnings · 30 days
          - type: statistics-graph
            chart_type: line
            days_to_show: 30
            period: day
            stat_types:
              - mean
            entities:
              - entity: salad_chopping:earnings_daily_replace_with_entry_id
                name: Chopped
                color: "#f44336"
